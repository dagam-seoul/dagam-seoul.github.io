<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>웰니스 학습라운지 다감 만족도 조사</title>
<meta name="robots" content="noindex">

<style>
:root{--ink:#1d1d1b;--sub:#5e5a52;--bg:#f7f6f2;--card:#fff;--line:#ddd8ce;--accent:#f2c200;--ok:#1f7a3a;--warn:#b4561e;--dim:#9a958b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{font-size:18px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 120px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{font-weight:900;letter-spacing:.02em;font-size:20px}
.brand .logo{display:block;height:28px;width:auto;margin-bottom:6px}
.brand small{display:block;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.1em}
.prog{height:6px;background:#e9e5dd;border-radius:99px;overflow:hidden;margin:6px 0 18px}
.prog i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px}
h1{font-size:26px;line-height:1.35;margin:0 0 10px;font-weight:900;word-break:keep-all}
h2{font-size:22px;line-height:1.4;margin:0 0 6px;font-weight:800;word-break:keep-all}
.hint{color:var(--sub);font-size:15px;margin:0 0 16px;word-break:keep-all}
p{word-break:keep-all}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:block;width:100%;text-align:left;padding:16px 18px;font:inherit;font-size:18px;font-weight:600;background:#fff;border:2px solid var(--line);border-radius:14px;color:var(--ink);cursor:pointer;word-break:keep-all}
.opt.on{border-color:var(--ink);background:#fbf6dd}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px}
.scale .opt{text-align:center;padding:14px 2px;font-size:22px;font-weight:800}
.scale-lab{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-top:6px}
textarea{width:100%;min-height:120px;font:inherit;font-size:17px;padding:14px;border:2px solid var(--line);border-radius:14px;margin-top:12px}
.nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.nav .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;padding:17px;font:inherit;font-size:18px;font-weight:800;border-radius:14px;border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);flex:0 0 34%}
.btn:disabled{opacity:.35;cursor:default}
.coupon{text-align:center}
.coupon .code{font-size:46px;font-weight:900;letter-spacing:.18em;margin:6px 0 2px}
.coupon .gift{display:inline-block;margin:12px 0 4px;padding:10px 18px;border-radius:99px;background:var(--accent);font-weight:900;font-size:22px}
.badge{display:inline-block;padding:6px 14px;border-radius:99px;font-weight:800;font-size:15px}
.used{background:#e7e5df;color:#6b665d}
.ready{background:#e3f0e3;color:var(--ok)}
.check{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fdf1e7;color:var(--warn);font-size:15px;font-weight:600;word-break:keep-all}
.coupon.is-used .code,.coupon.is-used .gift{opacity:.35;text-decoration:line-through}
.small{font-size:14px;color:var(--sub)}
.staffbtn{margin-top:22px;width:100%;padding:15px;font:inherit;font-size:16px;font-weight:700;border-radius:12px;border:1.5px dashed var(--sub);background:transparent;color:var(--sub);cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.modal.on{display:flex}
.modal .card{width:100%;max-width:380px}
input.pin{width:100%;font:inherit;font-size:30px;letter-spacing:.4em;text-align:center;padding:12px;border:2px solid var(--line);border-radius:12px;margin:14px 0}
input.codein{width:100%;font:inherit;font-size:26px;letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:12px;border:2px solid var(--line);border-radius:12px}
.row{display:flex;gap:10px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:28px}
.stat span{font-size:14px;color:var(--sub)}
.over{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
th{background:#f1eee7}
.err{color:#b00020;font-weight:700;margin-top:10px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;display:none;z-index:10}
.giftpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.giftpick .opt{text-align:center;padding:14px 6px;font-size:16px}
.etc{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;margin-top:8px}
.sec{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--sub);margin-bottom:8px}
.lead b{display:block;font-weight:700;color:#3a362f}.lead .ld{display:block;font-weight:700;color:#3a362f}.lead .ld+b{margin-top:8px}
.lead{background:#fbf6dd;border-radius:12px;padding:12px 14px;font-size:15px;color:#4a463e;margin:0 0 14px;word-break:keep-all}
.leadimg{display:block;width:100%;height:200px;object-fit:cover;border-radius:12px;margin:0 0 10px}
.brandbox{display:flex;gap:12px;align-items:center;margin-bottom:8px}.brandbox img{width:64px;height:auto;flex:0 0 auto;border-radius:6px}
.brandbox .bt{display:block;margin-bottom:4px}.brandbox span{display:block;font-weight:700;color:#3a362f}.brandbox+b{margin-top:8px}
.opts.multi .opt{padding-left:48px;position:relative;font-size:17px}
.opts.multi .opt::before{content:'';position:absolute;left:16px;top:50%;width:20px;height:20px;margin-top:-10px;border:2px solid var(--line);border-radius:5px;background:#fff}
.opts.multi .opt.on::before{background:var(--ink);border-color:var(--ink)}
.opts.multi .opt.on::after{content:'';position:absolute;left:23px;top:50%;width:6px;height:11px;margin-top:-8px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.lead .evt{display:block;font-weight:600;margin-top:6px}.lead .small2{font-size:13px;color:var(--sub)}
.lead .evt-box{display:block;margin-top:10px;padding:10px 12px;background:#fff;border-radius:10px;font-weight:500;font-size:13.5px;line-height:1.6;color:#4a463e}
.lead .evt-box b{display:block;margin-bottom:4px}.lead .evt+b,.lead .evt-box+b{margin-top:10px}
.flab{display:block;font-size:15px;font-weight:700;margin:14px 0 0}
.guide{font-size:13px;color:var(--sub);background:#f4f2ec;border-radius:10px;padding:10px 12px;margin:4px 0 8px;word-break:keep-all;line-height:1.5}
</style>
</head>

const EVENT_HTML = `<b class="bt">🎁 '웰니스 학습라운지 다감' 설문 참여 감사 이벤트 안내</b>

const QI = {}; Q.forEach(q => QI[q.id] = q);

/* ---------- 공통 ---------- */
async function rpc(fn, body){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {method:'POST', headers:{'apikey':SB_KEY,'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl = s => esc(s).replace(/\n/g,'<br>');
function store(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; } }
function save(o){ try{ localStorage.setItem(LS_KEY, JSON.stringify(Object.assign(store(), o))); }catch(e){} }
function deviceId(){ let s = store(); if(s.device) return s.device; const id = (crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random().toString(36).slice(2)); save({device:id}); return id; }
function toast(t){ const el=$('#toast'); el.textContent=t; el.style.display='block'; setTimeout(()=>el.style.display='none', 2400); }
function fmtTime(t){ if(!t) return ''; return new Date(t).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function ansText(q, a){
  if(q.type==='contact') return [a[q.id+'_name'], a[q.id+'_phone']].filter(Boolean).join(' / ');
  const v = a[q.id]; if(v===undefined || v===null || v==='') return '';
  if(q.type==='contact') return '';
  if(q.type==='text') return v;
  const lab = x => { if(x==='etc') return '기타: ' + (a[q.id+'_etc'] || ''); const o = q.opts.find(o => o[0]===x); return o ? o[1] : x; };
  if(Array.isArray(v)) return v.map(lab).join(' / ');
  return lab(v);
}

/* ---------- 구글시트 ---------- */
function sheetPost(obj){ if(!SHEET_WEBHOOK) return; try{ fetch(SHEET_WEBHOOK, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(obj)}).catch(()=>{}); }catch(e){} }
function sheetResponse(code){
  const head = ['응답시각', ...PUBLIC_Q.map(q => `[${q.sec}] ${q.no||''}${q.tag?' '+q.tag:''} ${q.title}`)];
  const row = [new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}), ...PUBLIC_Q.map(q => ansText(q, A))];
  sheetPost({type:'response', sheet:'통합만족도', headers:head, row});
}

/* ---------- 설문 ---------- */
let A = {}, idx = -1, sending = false;
const visible = () => Q.filter(q => !q.when || q.when(A));
function cleanup(){ const ids = new Set(visible().map(q=>q.id)); Object.keys(A).forEach(k => { const base = k.replace(/_(etc|name|phone)$/,''); if(!ids.has(base)) delete A[k]; }); }

function renderIntro(){
  $('#nav').style.display=''; $('#progWrap').style.visibility='hidden'; $('#step').textContent='';
  $('#app').innerHTML = `<div class="card">
    <h1>웰니스 학습라운지 다감<br>만족도 조사</h1>
    <p>안녕하세요! 웰니스 학습라운지 다감에서 보낸 시간은 어떠셨나요?</p>
    <p>시설과 이용 환경, 이벤트 공간(다감 우체국·다감가든) 체험, 앞으로 바라는 프로그램에 대한 의견을 편하게 들려주세요. 여러분의 의견은 다감을 더 편안하고 좋은 공간으로 만드는 데 활용하겠습니다.</p>
    <p class="small">약 2~3분 소요 예정</p>
  </div>`;
  $('#back').style.visibility='hidden'; $('#next').textContent='시작하기'; $('#next').disabled=false;
}

function renderQ(){
  const vs = visible(); const q = vs[idx]; const prev = vs[idx-1];
  $('#progWrap').style.visibility='visible';
  $('#prog').style.width = Math.round(idx/vs.length*100)+'%';
  $('#step').textContent = `${idx+1} / ${vs.length}`;
  const showLead = q.sec !== (prev && prev.sec) && (q.lead || null);
  let body = '';
  const cur = A[q.id];
  const isOn = v => q.type==='multi' ? (Array.isArray(cur) && cur.includes(v)) : String(cur)===String(v);
  const hasEtc = q.type==='multi' ? isOn('etc') : cur==='etc';
  if(q.type==='single' || q.type==='multi'){
    body = `<div class="opts ${q.type==='multi'?'multi':''}">${q.opts.map(([v,t]) => `<button class="opt ${isOn(v)?'on':''}" data-v="${v}">${esc(t)}</button>`).join('')}</div>`;
    if(hasEtc) body += `<input class="etc" id="etcIn" maxlength="200" placeholder="직접 입력해 주세요" value="${esc(A[q.id+'_etc']||'')}">`;
  } else if(q.type==='contact'){
    body = `<label class="flab">성함</label><input class="etc" id="cName" maxlength="30" autocomplete="name" value="${esc(A[q.id+'_name']||'')}">
      <label class="flab">연락처</label><input class="etc" id="cPhone" inputmode="numeric" maxlength="13" autocomplete="tel" placeholder="010-0000-0000" value="${esc(A[q.id+'_phone']||'')}">
      <p class="small" id="cErr" style="color:var(--warn);margin:8px 0 0"></p>`;
  } else {
    body = `<textarea id="txt" maxlength="800" placeholder="자유롭게 적어 주세요">${esc(A[q.id]||'')}</textarea>`;
  }
  let leadHtml = '';
  if(showLead && showLead.img) leadHtml = `<img class="leadimg" src="${showLead.img}" alt="${esc(showLead.alt||'')}">`;
  if(showLead && showLead.brand) leadHtml = `<div class="brandbox"><img src="${LOGO_DAGAM}" alt="다감 로고"><div><b class="bt">💡 '웰니스 학습라운지 다감'이란?</b><span>[다감] 무뎌진 다양한 감각(多感)을 다시 깨우며 '다시, 감각하는 삶'으로, 시민 삶의 질을 높이는 공간</span></div></div>`;
  if(showLead && showLead.event) leadHtml = EVENT_HTML;
  if(typeof showLead === 'string') leadHtml = `<span class="ld">${esc(showLead)}</span>`;
  $('#app').innerHTML = `<div class="card"><span class="sec">${esc(q.sec)}${q.tag?' · '+esc(q.tag):''}</span>
    ${(showLead && showLead.img) ? leadHtml : ''}
    ${((showLead && !showLead.img)||q.stem)?`<div class="lead">${(showLead && !showLead.img)?leadHtml:''}${q.stem?`<b>${esc(q.stem)}</b>`:''}</div>`:''}
    <h2>${q.no?esc(q.no)+'. ':''}${esc(q.title)}</h2>${q.hint?`<p class="hint">${nl(q.hint)}</p>`:''}${body}</div>`;
  $('#app').querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const raw = b.dataset.v;
    if(q.type==='multi'){
      const arr = Array.isArray(A[q.id]) ? A[q.id].slice() : [];
      const i = arr.indexOf(raw); if(i>=0) arr.splice(i,1); else arr.push(raw);
      if(arr.length) A[q.id] = arr; else delete A[q.id];
      if(!arr.includes('etc')) delete A[q.id+'_etc'];
      renderQ(); if(raw==='etc' && i<0){ const e=$('#etcIn'); if(e) e.focus(); } return;
    }
    const v = (q.num && /^\d+$/.test(raw)) ? Number(raw) : raw;
    A[q.id] = v; if(v!=='etc') delete A[q.id+'_etc']; cleanup(); renderQ();
    if(v==='etc'){ const e=$('#etcIn'); if(e) e.focus(); return; }
    setTimeout(() => { const vv = visible(); if(vv[idx]===q && idx < vv.length-1) go(1); }, 220);
  });
  const t = $('#txt'); if(t) t.oninput = () => { A[q.id] = t.value; };
  const e = $('#etcIn'); if(e) e.oninput = () => { A[q.id+'_etc'] = e.value; };
  $('#back').style.visibility='visible';
  $('#next').textContent = idx === vs.length-1 ? '제출하기' : '다음';
  $('#next').disabled = !(q.optional || (A[q.id] !== undefined && A[q.id] !== '' && !(Array.isArray(A[q.id]) && !A[q.id].length)));
  if(q.type==='contact'){
    const fmt = v => { const d = v.replace(/\D/g,'').slice(0,11); return d.length<4?d : d.length<8? d.slice(0,3)+'-'+d.slice(3) : d.slice(0,3)+'-'+d.slice(3,d.length-4)+'-'+d.slice(-4); };
    const chk = () => { const n = (A[q.id+'_name']||'').trim(), ph = (A[q.id+'_phone']||'').replace(/\D/g,'');
      const ok = n.length>=2 && /^01\d{8,9}$/.test(ph); $('#next').disabled = !ok;
      $('#cErr').textContent = (ph.length>=10 && !/^01\d{8,9}$/.test(ph)) ? '휴대폰 번호를 확인해 주세요.' : ''; };
    $('#cName').oninput = e => { A[q.id+'_name'] = e.target.value; chk(); };
    $('#cPhone').oninput = e => { e.target.value = fmt(e.target.value); A[q.id+'_phone'] = e.target.value; chk(); };
    chk();
  }
}

function go(d){
  const vs = visible();
  if(idx === -1 && d>0){ idx = 0; return renderQ(); }
  if(d<0){ if(idx<=0){ idx=-1; return renderIntro(); } idx--; return renderQ(); }
  if(idx >= vs.length-1) return submit();
  idx++; renderQ();
}

async function submit(){
  if(sending) return; sending = true; $('#next').disabled = true; $('#next').textContent='보내는 중…';
  cleanup(); A.v = SURVEY_VER;
  try{
    const res = await rpc('dagam3_submit', {p_device: deviceId(), p_answers: A});
    save({code: res.code});
    if(!res.existing) sheetResponse(res.code);
    showDone(false);
  }catch(err){
    sending = false; $('#next').disabled=false; $('#next').textContent='다시 제출하기';
    toast('전송에 실패했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.');
  }
}

/* ---------- PIN 입력 ---------- */
function pinGate(fn, key, next){
  $('#app').innerHTML = `<div class="card"><h2>PIN 입력</h2><p class="hint">${fn==='dagam3_admin'?'관리자':'스태프'} PIN 4자리</p>
    <input class="pin" id="gatePin" inputmode="numeric" maxlength="4"><button class="btn" style="width:100%" id="gateOk">확인</button><div class="err" id="gateErr"></div></div>`;
  $('#gateOk').onclick = async () => {
    const p = $('#gatePin').value.trim();
    try{ const d = await rpc(fn, {p_pin: p});
      if(d.status==='ok'){ try{ sessionStorage.setItem(key, p); }catch(e){} next(); } else $('#gateErr').textContent='PIN이 맞지 않아요.';
    }catch(e){ $('#gateErr').textContent='연결 실패'; }
  };
}

      if($('#resetIn').value.trim()!=='삭제'){ $('#resetErr').textContent="'삭제'라고 입력해야 진행돼요."; return; }
      $('#resetYes').disabled = true;
      try{ const r = await rpc('dagam3_reset', {p_pin: pin});
        if(r.status==='ok'){ toast(`응답 ${r.deleted}건을 삭제했어요.`); again(); }
        else $('#resetErr').textContent = 'PIN이 맞지 않아요.';
      }catch(e){ $('#resetErr').textContent = '삭제 실패. 연결을 확인해 주세요.'; }
      $('#resetYes').disabled = false;
    };
  };
  const toCsv = (list, QS, name) => {
    const head = ['응답시각', ...QS.map(q => `[${q.sec}] ${q.no||''}${q.tag?' '+q.tag:''} ${q.title}`)];
    const lines = [head, ...list.map(r => [new Date(r.created_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}), ...QS.map(q => ansText(q, r.answers))])]
      .map(row => row.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff'+lines], {type:'text/csv;charset=utf-8'}));
    a.download = name+'_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  };
  $('#csv').onclick = () => toCsv(rows, isAdmin ? Q : PUBLIC_Q, 'dagam_통합만족도');
  if(isAdmin){
    $('#csvC').onclick = () => {
      const list = rows.filter(r => r.answers.c1==='y' && r.answers.c2_name);
      const lines = [['응답시각','성함','연락처'], ...list.map(r => [new Date(r.created_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}), r.answers.c2_name||'', r.answers.c2_phone||''])]
        .map(row => row.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff'+lines], {type:'text/csv;charset=utf-8'}));
      a.download = 'dagam_추첨대상자_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
    };
    $('#purgeBtn').onclick = async () => {
      if($('#purgeBtn').dataset.step!=='2'){ $('#purgeBtn').dataset.step='2'; $('#purgeBtn').textContent='한 번 더 누르면 연락처가 파기돼요'; return; }
      $('#purgeBtn').disabled = true;
      try{ const r = await rpc('dagam3_purge_contacts', {p_pin: pin});
        if(r.status==='ok'){ toast(`연락처 ${r.purged}건을 파기했어요.`); again(); } else toast('PIN이 맞지 않아요.');
      }catch(e){ toast('파기 실패. 연결을 확인해 주세요.'); $('#purgeBtn').disabled = false; }
    };
  }
}

/* ---------- 시작 ---------- */
$('#next').onclick = () => go(1);
$('#back').onclick = () => go(-1);
const qs = location.search;
if(qs.includes('reset')){ try{ localStorage.removeItem(LS_KEY); }catch(e){} location.replace(location.pathname); }
else if(qs.includes('admin')) renderAdmin();
else if(qs.includes('staff')) renderStaff();
else { const s = store(); if(s.code) showDone(true); else renderIntro(); }
</script>
</body>
</html>
