<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다감 상시 이벤트 만족도 조사</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#1d1d1b;--sub:#5e5a52;--bg:#f7f6f2;--card:#fff;--line:#ddd8ce;--accent:#f2c200;--ok:#1f7a3a;--warn:#b4561e;--dim:#9a958b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{font-size:18px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 120px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{font-weight:900;letter-spacing:.02em;font-size:20px}
.brand small{display:block;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.1em}
.prog{height:6px;background:#e9e5dd;border-radius:99px;overflow:hidden;margin:6px 0 18px}
.prog i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px}
h1{font-size:26px;line-height:1.35;margin:0 0 10px;font-weight:900;word-break:keep-all}
h2{font-size:22px;line-height:1.4;margin:0 0 6px;font-weight:800;word-break:keep-all}
.hint{color:var(--sub);font-size:15px;margin:0 0 16px;word-break:keep-all}
p{word-break:keep-all}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:block;width:100%;text-align:left;padding:16px 18px;font:inherit;font-size:18px;font-weight:600;background:#fff;border:2px solid var(--line);border-radius:14px;color:var(--ink);cursor:pointer;word-break:keep-all}
.opt.on{border-color:var(--ink);background:#fbf6dd}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px}
.scale .opt{text-align:center;padding:14px 2px;font-size:22px;font-weight:800}
.scale-lab{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-top:6px}
textarea{width:100%;min-height:120px;font:inherit;font-size:17px;padding:14px;border:2px solid var(--line);border-radius:14px;margin-top:12px}
.nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.nav .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;padding:17px;font:inherit;font-size:18px;font-weight:800;border-radius:14px;border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);flex:0 0 34%}
.btn:disabled{opacity:.35;cursor:default}
.coupon{text-align:center}
.coupon .code{font-size:46px;font-weight:900;letter-spacing:.18em;margin:6px 0 2px}
.coupon .gift{display:inline-block;margin:12px 0 4px;padding:10px 18px;border-radius:99px;background:var(--accent);font-weight:900;font-size:22px}
.badge{display:inline-block;padding:6px 14px;border-radius:99px;font-weight:800;font-size:15px}
.used{background:#e7e5df;color:#6b665d}
.ready{background:#e3f0e3;color:var(--ok)}
.check{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fdf1e7;color:var(--warn);font-size:15px;font-weight:600;word-break:keep-all}
.coupon.is-used .code,.coupon.is-used .gift{opacity:.35;text-decoration:line-through}
.small{font-size:14px;color:var(--sub)}
.staffbtn{margin-top:22px;width:100%;padding:15px;font:inherit;font-size:16px;font-weight:700;border-radius:12px;border:1.5px dashed var(--sub);background:transparent;color:var(--sub);cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.modal.on{display:flex}
.modal .card{width:100%;max-width:380px}
input.pin{width:100%;font:inherit;font-size:30px;letter-spacing:.4em;text-align:center;padding:12px;border:2px solid var(--line);border-radius:12px;margin:14px 0}
input.codein{width:100%;font:inherit;font-size:26px;letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:12px;border:2px solid var(--line);border-radius:12px}
.row{display:flex;gap:10px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:28px}
.stat span{font-size:14px;color:var(--sub)}
.over{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
th{background:#f1eee7}
.err{color:#b00020;font-weight:700;margin-top:10px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;display:none;z-index:10}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="brand">다감 <small>WELLNESS LEARNING LOUNGE</small></div><div class="small" id="step"></div></header>
  <div class="prog" id="progWrap"><i id="prog"></i></div>
  <main id="app"></main>
</div>
<div class="nav" id="nav"><div class="in"><button class="btn ghost" id="back">이전</button><button class="btn" id="next">다음</button></div></div>

<div class="modal" id="pinModal"><div class="card">
  <h2>담당자 확인</h2><p class="hint">부스 담당자 PIN 4자리를 입력해 주세요.</p>
  <input class="pin" id="pinIn" inputmode="numeric" maxlength="4" autocomplete="off">
  <div class="row"><button class="btn ghost" id="pinCancel">취소</button><button class="btn" id="pinOk">증정 완료</button></div>
  <div class="err" id="pinErr"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://oeanjnpliiibjjvzfkmc.supabase.co';
const SB_KEY = 'sb_publishable_sHlEN3-Q3q2kuWc_U5IwSg_5k--8LhF';
const LS_KEY = 'dagam_survey_v1';
const SHEET_WEBHOOK = ''; // 구글 Apps Script 웹앱 주소(https://script.google.com/macros/s/.../exec)를 넣으면 시트에 자동 저장
function sheetPost(obj){
  if(!SHEET_WEBHOOK) return;
  try{ fetch(SHEET_WEBHOOK, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(obj)}); }catch(e){}
}
function sheetResponse(code, gift, needCheck){
  const head = ['응답시각','교환권','기념품','확인필요', ...Q.map(q=>q.id.toUpperCase()+' '+q.title)];
  const row = [new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}), code, GIFT[gift]||'', needCheck||'',
    ...Q.map(q => { const v = A[q.id]; if(v===undefined) return ''; if(q.type==='scale'||q.type==='text') return v;
      if(q.type==='yn') return v==='y'?'예':'아니오'; const o = q.opts.find(o=>o[0]===v); return o?o[1]:v; })];
  sheetPost({type:'response', headers: head, row});
}
function sheetRedeem(code, gift, time){
  sheetPost({type:'redeem', code, gift: GIFT[gift]||gift, time: new Date(time||Date.now()).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})});
}
const GIFT = {tea:'블렌드티 세트', seed:'씨앗팔레트'};
const CHECK = {reservation:'담당자 확인: 올리 예약 확정 문자 또는 현장 등록 확인', app_review:'담당자 확인: 손목닥터9988 앱 설치 또는 네이버 리뷰 화면 확인'};

async function rpc(fn, body){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {method:'POST', headers:{'apikey':SB_KEY,'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function store(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; } }
function save(o){ try{ localStorage.setItem(LS_KEY, JSON.stringify(Object.assign(store(), o))); }catch(e){} }
function deviceId(){ let s = store(); if(s.device) return s.device; const id = (crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random().toString(36).slice(2)); save({device:id}); return id; }
function toast(t){ const el=$('#toast'); el.textContent=t; el.style.display='block'; setTimeout(()=>el.style.display='none', 2200); }
function fmtTime(t){ if(!t) return ''; const d=new Date(t); return d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }

/* ---------- 문항 ---------- */
const SCALE = {type:'scale'};
const Q = [
  {id:'q1', type:'single', title:'오늘 다감에 어떻게 오셨나요?', opts:[['program','프로그램에 참여했어요 (사전 예약 또는 현장 등록)'],['none','프로그램 없이 공간·이벤트만 이용했어요']]},
  {id:'q2', type:'single', title:'연령대를 골라 주세요.', opts:[['30','30대 이하'],['40','40대'],['50','50대'],['60','60대'],['70','70대 이상']]},
  {id:'q3', type:'single', title:'다감을 처음 어떻게 알게 되셨나요?', opts:[['kakao','카카오톡 광고'],['sns','인스타그램 등 SNS'],['naver','네이버 검색'],['org','서울시민대학·진흥원 안내'],['friend','지인 추천'],['walk','지나가다'],['etc','기타']]},
  {id:'e1', type:'yn', title:'‘다감 웰니스 우체국’에 참여하셨나요?', hint:'감각 편지를 받고, 나를 돌보는 방법을 적어 부치는 이벤트예요.'},
  {id:'a1', ...SCALE, title:'‘다감 웰니스 우체국’에 전반적으로 만족한다.', when:a=>a.e1==='y'},
  {id:'a2', ...SCALE, title:'받은 감각 편지가 오늘의 나를 돌아보는 데 도움이 됐다.', when:a=>a.e1==='y'},
  {id:'a3', type:'single', title:'오늘 받은 편지는 어떤 감각이었나요?', opts:[['scent','향'],['taste','맛'],['touch','촉각'],['move','움직임'],['rest','쉼'],['none','기억나지 않음']], when:a=>a.e1==='y'},
  {id:'e2', type:'yn', title:'‘나의 걸음은 무슨 색?’에 참여하셨나요?', hint:'오늘 걸은 만큼의 색 스티커를 서울 지도에 붙이는 이벤트예요.'},
  {id:'b1', ...SCALE, title:'‘나의 걸음은 무슨 색?’에 전반적으로 만족한다.', when:a=>a.e2==='y'},
  {id:'b2', ...SCALE, title:'이벤트에 참여하며 일상에서 더 걸어 보고 싶어졌다.', when:a=>a.e2==='y'},
  {id:'b3', type:'single', title:'손목닥터9988을 이용하고 계신가요?', opts:[['using','원래 쓰고 있어요'],['today','오늘 가입했어요'],['will','가입할 생각이 있어요'],['no','가입할 생각이 없어요'],['unknown','잘 모르겠어요']], when:a=>a.e2==='y'},
  {id:'e3', type:'yn', title:'‘다감가든’을 둘러보거나 참여하셨나요?'},
  {id:'g1', ...SCALE, title:'‘다감가든’에 전반적으로 만족한다.', when:a=>a.e3==='y'},
  {id:'g2', ...SCALE, title:'다감가든에서 계절과 자연의 감각을 느낄 수 있었다.', when:a=>a.e3==='y'},
  {id:'g3', type:'single', title:'다감가든에서 가장 좋았던 것을 골라 주세요.', opts:[['plants','식물·정원 연출'],['flower','종이꽃 남기기'],['photo','사진 촬영'],['rest','쉬어 가는 자리'],['etc','기타']], when:a=>a.e3==='y'},
  {id:'c1', ...SCALE, title:'이벤트 참여 방법 안내가 이해하기 쉬웠다.'},
  {id:'c2', ...SCALE, title:'이벤트를 통해 다감의 공간과 프로그램에 관심이 생겼다.'},
  {id:'c3', ...SCALE, title:'다감에 다시 방문할 의향이 있다.'},
  {id:'c4', type:'text', title:'좋았던 점이나 바라는 점을 자유롭게 적어 주세요.', hint:'선택 문항이에요. 비워 두셔도 됩니다.', optional:true},
  {id:'r1', type:'yn', title:'오늘 손목닥터9988 앱을 설치했거나 다감 네이버 리뷰를 작성하셨나요?', hint:'기념품 확인용이에요. 받으실 때 담당자에게 화면을 보여 주세요.',
    when:a=>(a.q1==='none' && a.e1!=='y') || (a.q1==='program' && a.e1!=='y' && a.e2==='y')}
];

let A = {}, idx = -1, sending = false;
const visible = () => Q.filter(q => !q.when || q.when(A));

function renderIntro(){
  $('#progWrap').style.visibility='hidden'; $('#step').textContent='';
  $('#app').innerHTML = `<div class="card">
    <h1>다감 상시 이벤트<br>만족도 조사</h1>
    <p class="hint" style="font-size:17px">웰니스 우체국 · 나의 걸음은 무슨 색? · 다감가든에 대한 짧은 설문이에요.</p>
    <p>약 <b>3분</b>이면 끝나요.<br>이름과 연락처는 받지 않는 <b>익명 조사</b>이며, 결과는 다감 운영 개선에만 씁니다.</p>
    <p class="small">설문을 마치면 화면에 교환권이 나와요. 기념품 대상이면 부스 담당자나 웰컴존 안내데스크에 보여 주세요. (소진 시 종료)</p>
  </div>`;
  $('#back').style.visibility='hidden'; $('#next').textContent='시작하기'; $('#next').disabled=false;
}

function renderQ(){
  const vs = visible(); const q = vs[idx];
  $('#progWrap').style.visibility='visible';
  $('#prog').style.width = Math.round((idx)/vs.length*100)+'%';
  $('#step').textContent = `${idx+1} / ${vs.length}`;
  let body = '';
  if(q.type==='single' || q.type==='yn'){
    const opts = q.type==='yn' ? [['y','예'],['n','아니오']] : q.opts;
    body = `<div class="opts">${opts.map(([v,t])=>`<button class="opt ${A[q.id]===v?'on':''}" data-v="${v}">${esc(t)}</button>`).join('')}</div>`;
  } else if(q.type==='scale'){
    body = `<div class="scale">${[1,2,3,4,5].map(v=>`<button class="opt ${A[q.id]==v?'on':''}" data-v="${v}">${v}</button>`).join('')}</div>
      <div class="scale-lab"><span>전혀 그렇지 않다</span><span>보통</span><span>매우 그렇다</span></div>`;
  } else if(q.type==='text'){
    body = `<textarea id="txt" maxlength="500" placeholder="자유롭게 적어 주세요">${esc(A[q.id]||'')}</textarea>`;
  }
  $('#app').innerHTML = `<div class="card"><h2>${esc(q.title)}</h2>${q.hint?`<p class="hint">${esc(q.hint)}</p>`:''}${body}</div>`;
  $('#app').querySelectorAll('.opt').forEach(b => b.onclick = () => {
    A[q.id] = q.type==='scale' ? Number(b.dataset.v) : b.dataset.v;
    cleanup(); renderQ();
    setTimeout(()=>{ const v = visible(); if(v[idx]===q && idx < v.length-1) go(1); }, 220);
  });
  const t = $('#txt'); if(t) t.oninput = () => { A[q.id] = t.value; };
  $('#back').style.visibility='visible';
  const last = idx === vs.length-1;
  $('#next').textContent = last ? '제출하기' : '다음';
  $('#next').disabled = !(q.optional || A[q.id] !== undefined && A[q.id] !== '');
}
function cleanup(){ const ids = new Set(visible().map(q=>q.id)); Object.keys(A).forEach(k=>{ if(!ids.has(k)) delete A[k]; }); }

function go(d){
  const vs = visible();
  if(idx === -1 && d>0){ idx = 0; return renderQ(); }
  if(d<0){ if(idx<=0){ idx=-1; return renderIntro(); } idx--; return renderQ(); }
  if(idx >= vs.length-1) return submit();
  idx++; renderQ();
}

async function submit(){
  if(sending) return; sending = true; $('#next').disabled = true; $('#next').textContent='보내는 중…';
  cleanup();
  try{
    const res = await rpc('dagam_submit', {p_device: deviceId(), p_answers: A});
    save({code: res.code});
    if(!res.existing) sheetResponse(res.code, res.gift, res.need_check);
    showCoupon(res.code, res);
  }catch(e){
    sending = false; $('#next').disabled=false; $('#next').textContent='다시 제출하기';
    toast('전송에 실패했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.');
  }
}

/* ---------- 교환권 ---------- */
async function showCoupon(code, pre){
  $('#nav').style.display='none'; $('#progWrap').style.visibility='hidden'; $('#step').textContent='';
  let c = pre;
  try{ if(!c || c.redeemed_at === undefined) c = await rpc('dagam_coupon', {p_code: code}); }catch(e){}
  if(!c){ $('#app').innerHTML = `<div class="card"><h2>교환권을 불러오지 못했어요</h2><p class="hint">인터넷 연결을 확인한 뒤 새로고침해 주세요.</p></div>`; return; }
  const used = !!c.redeemed_at;
  if(!c.gift){
    $('#app').innerHTML = `<div class="card coupon"><h1>참여해 주셔서<br>감사합니다</h1>
      <p class="hint">응답 번호 <b>${esc(code)}</b></p>
      <p class="small">기념품은 프로그램 참여 후 웰니스 우체국에 참여한 분(블렌드티 세트), 이벤트 참여 후 손목닥터9988 앱 설치 또는 네이버 리뷰를 작성한 분(씨앗팔레트)께 드려요.</p></div>`;
    return;
  }
  $('#app').innerHTML = `<div class="card coupon ${used?'is-used':''}">
    <div>${used?`<span class="badge used">증정 완료 · ${fmtTime(c.redeemed_at)}</span>`:`<span class="badge ready">사용 가능</span>`}</div>
    <p class="small" style="margin:14px 0 0">기념품 교환권</p>
    <div class="code">${esc(code)}</div>
    <div class="gift">${GIFT[c.gift]}</div>
    ${used?'':`<p style="margin:14px 0 0">이 화면을 <b>부스 담당자</b> 또는<br><b>웰컴존 안내데스크</b>에 보여 주세요.</p>`}
    ${!used && c.need_check ? `<div class="check">${CHECK[c.need_check]}</div>`:''}
    <p class="small" style="margin-top:14px">소진 시 종료 · 1인 1회</p>
    ${used?'':`<button class="staffbtn" id="staffBtn">담당자 전용 · 증정 완료 처리</button>`}
  </div>`;
  const sb = $('#staffBtn'); if(sb) sb.onclick = () => openPin(code);
}

let pinCode = null;
function openPin(code){ pinCode = code; $('#pinIn').value=''; $('#pinErr').textContent=''; $('#pinModal').classList.add('on'); setTimeout(()=>$('#pinIn').focus(),50); }
$('#pinCancel').onclick = () => $('#pinModal').classList.remove('on');
$('#pinOk').onclick = async () => {
  const pin = $('#pinIn').value.trim(); if(pin.length<4) return;
  $('#pinOk').disabled = true;
  try{
    const r = await rpc('dagam_redeem', {p_code: pinCode, p_pin: pin});
    if(r.status==='bad_pin'){ $('#pinErr').textContent='PIN이 맞지 않아요.'; }
    else if(r.status==='already'){ $('#pinErr').textContent='이미 증정 완료된 교환권이에요 ('+fmtTime(r.redeemed_at)+').'; }
    else if(r.status==='ok'){
      $('#pinModal').classList.remove('on');
      sheetRedeem(pinCode, r.gift, r.redeemed_at);
      try{ sessionStorage.setItem('dagam_pin', pin); }catch(e){}
      const ct = r.counts; const k = r.gift;
      toast(`${GIFT[k]} 증정 완료 · 오늘 ${ct[k+'_today']}/${ct[k+'_daily_limit']}`);
      if(location.search.includes('staff')) renderStaff(); else showCoupon(pinCode);
    } else { $('#pinErr').textContent='처리할 수 없는 교환권이에요.'; }
  }catch(e){ $('#pinErr').textContent='전송 실패. 연결을 확인해 주세요.'; }
  $('#pinOk').disabled = false;
};

/* ---------- 담당자 화면 (?staff) ---------- */
function getPin(){ try{ return sessionStorage.getItem('dagam_pin'); }catch(e){ return null; } }
async function renderStaff(){
  $('#nav').style.display='none'; $('#progWrap').style.visibility='hidden'; $('#step').textContent='담당자';
  const pin = getPin();
  if(!pin){ return pinGate('dagam_staff', renderStaff); }
  let d; try{ d = await rpc('dagam_staff', {p_pin: pin}); }catch(e){ $('#app').innerHTML='<p class="err">불러오기 실패</p>'; return; }
  if(d.status!=='ok'){ try{sessionStorage.removeItem('dagam_pin');}catch(e){} return renderStaff(); }
  const c = d.counts;
  $('#app').innerHTML = `
    <h1>기념품 증정 현황</h1>
    <div class="stat">
      <div><span>블렌드티 세트 · 오늘</span><b class="${c.tea_today>c.tea_daily_limit?'over':''}">${c.tea_today} / ${c.tea_daily_limit}</b><span>누적 ${c.tea_all} / ${c.tea_total}</span></div>
      <div><span>씨앗팔레트 · 오늘</span><b class="${c.seed_today>c.seed_daily_limit?'over':''}">${c.seed_today} / ${c.seed_daily_limit}</b><span>누적 ${c.seed_all} / ${c.seed_total}</span></div>
    </div>
    <p class="small">오늘 설문 응답 ${c.resp_today}건 · 하루 한도는 내부 관리용이에요.</p>
    <div class="card" style="margin:14px 0">
      <h2>교환권 번호로 처리</h2><p class="hint">참여자 화면이 닫혔을 때 번호 5자리를 입력하세요.</p>
      <input class="codein" id="codeIn" maxlength="5" autocomplete="off">
      <button class="btn" style="width:100%;margin-top:10px" id="lookBtn">조회</button>
      <div id="look"></div>
    </div>
    <h2>최근 증정</h2>
    <table><tr><th>시간</th><th>번호</th><th>기념품</th></tr>
    ${d.recent.map(r=>`<tr><td>${fmtTime(r.redeemed_at)}</td><td>${esc(r.code)}</td><td>${GIFT[r.gift]||''}</td></tr>`).join('') || '<tr><td colspan="3">아직 없어요</td></tr>'}
    </table>
    <button class="staffbtn" onclick="renderStaff()">새로고침</button>`;
  $('#lookBtn').onclick = async () => {
    const code = $('#codeIn').value.trim().toUpperCase(); if(code.length<5) return;
    let c; try{ c = await rpc('dagam_coupon', {p_code: code}); }catch(e){}
    const box = $('#look');
    if(!c){ box.innerHTML = '<p class="err">없는 번호예요.</p>'; return; }
    if(!c.gift){ box.innerHTML = '<p class="err">기념품 대상이 아닌 응답이에요.</p>'; return; }
    if(c.redeemed_at){ box.innerHTML = `<p class="err">이미 증정 완료 (${fmtTime(c.redeemed_at)})</p>`; return; }
    box.innerHTML = `<p style="margin:12px 0 4px"><b>${GIFT[c.gift]}</b> · 사용 가능</p>${c.need_check?`<div class="check">${CHECK[c.need_check]}</div>`:''}
      <button class="btn" style="width:100%;margin-top:10px" id="doRedeem">증정 완료</button>`;
    $('#doRedeem').onclick = async () => {
      const r = await rpc('dagam_redeem', {p_code: code, p_pin: pin});
      if(r.status==='ok'){ sheetRedeem(code, r.gift, r.redeemed_at); toast(GIFT[r.gift]+' 증정 완료'); renderStaff(); } else box.innerHTML='<p class="err">처리 실패: '+r.status+'</p>';
    };
  };
}

function pinGate(fn, next){
  $('#app').innerHTML = `<div class="card"><h2>PIN 입력</h2><p class="hint">${fn==='dagam_admin'?'관리자':'담당자'} PIN 4자리</p>
    <input class="pin" id="gatePin" inputmode="numeric" maxlength="4"><button class="btn" style="width:100%" id="gateOk">확인</button><div class="err" id="gateErr"></div></div>`;
  $('#gateOk').onclick = async () => {
    const p = $('#gatePin').value.trim();
    try{ const d = await rpc(fn, {p_pin: p});
      if(d.status==='ok'){ try{ sessionStorage.setItem(fn==='dagam_admin'?'dagam_admin_pin':'dagam_pin', p); }catch(e){} next(); }
      else $('#gateErr').textContent='PIN이 맞지 않아요.';
    }catch(e){ $('#gateErr').textContent='연결 실패'; }
  };
}

/* ---------- 관리자 화면 (?admin) ---------- */
const LABEL = {}; Q.forEach(q=>{ LABEL[q.id]=q; });
function optText(q, v){ if(v===undefined||v===null) return ''; if(q.type==='yn') return v==='y'?'예':'아니오'; if(q.opts){ const o=q.opts.find(o=>o[0]===v); return o?o[1]:v; } return v; }
async function renderAdmin(){
  $('#nav').style.display='none'; $('#progWrap').style.visibility='hidden'; $('#step').textContent='관리자';
  let pin; try{ pin = sessionStorage.getItem('dagam_admin_pin'); }catch(e){}
  if(!pin) return pinGate('dagam_admin', renderAdmin);
  let d; try{ d = await rpc('dagam_admin', {p_pin: pin}); }catch(e){ $('#app').innerHTML='<p class="err">불러오기 실패</p>'; return; }
  if(d.status!=='ok'){ try{sessionStorage.removeItem('dagam_admin_pin');}catch(e){} return renderAdmin(); }
  const rows = d.rows; const c = d.counts;
  const day = t => new Date(t).toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit'});
  const byDay = {};
  rows.forEach(r => { const k = day(r.created_at); byDay[k] = byDay[k] || {n:0,tea:0,seed:0}; byDay[k].n++;
    if(r.redeemed_at){ const k2 = day(r.redeemed_at); byDay[k2] = byDay[k2] || {n:0,tea:0,seed:0}; byDay[k2][r.gift]++; } });
  const avg = (id, grp) => { const v = rows.filter(r=>!grp || r.visit_type===grp).map(r=>r.answers[id]).filter(x=>typeof x==='number'); if(!v.length) return ['–','–',0];
    return [(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2), Math.round(v.filter(x=>x>=4).length/v.length*100)+'%', v.length]; };
  const scaleIds = Q.filter(q=>q.type==='scale').map(q=>q.id);
  $('#app').innerHTML = `
    <h1>설문·기념품 현황</h1>
    <div class="stat">
      <div><span>전체 응답</span><b>${rows.length}</b><span>오늘 ${c.resp_today}</span></div>
      <div><span>기념품 증정 누적</span><b>${c.tea_all + c.seed_all}</b><span>블렌드티 ${c.tea_all}/${c.tea_total} · 씨앗 ${c.seed_all}/${c.seed_total}</span></div>
    </div>
    <button class="btn" style="width:100%;margin:6px 0 18px" id="csv">응답 전체 CSV 내려받기</button>
    <h2>날짜별</h2>
    <table><tr><th>날짜</th><th>응답</th><th>블렌드티</th><th>씨앗</th></tr>
    ${Object.keys(byDay).sort().map(k=>`<tr><td>${k}</td><td>${byDay[k].n}</td><td>${byDay[k].tea||0}</td><td>${byDay[k].seed||0}</td></tr>`).join('')}</table>
    <h2 style="margin-top:22px">만족도 (평균 · 긍정률 4~5점)</h2>
    <table><tr><th>문항</th><th>전체</th><th>프로그램 참여</th><th>미참여</th></tr>
    ${scaleIds.map(id=>{ const a=avg(id), p=avg(id,'program'), n=avg(id,'none');
      return `<tr><td>${id.toUpperCase()} ${esc(LABEL[id].title)}</td><td>${a[0]} · ${a[1]} (${a[2]})</td><td>${p[0]} · ${p[1]}</td><td>${n[0]} · ${n[1]}</td></tr>`; }).join('')}
    </table>
    <p class="small">설정 변경(PIN·하루 한도·총수량)은 Supabase의 dagam_settings 표에서 합니다.</p>`;
  $('#csv').onclick = () => {
    const cols = ['created_at','coupon_code','gift','need_check','redeemed_at', ...Q.map(q=>q.id)];
    const head = ['응답시각','교환권','기념품','확인필요','증정시각', ...Q.map(q=>q.id.toUpperCase()+' '+q.title)];
    const lines = [head, ...rows.map(r => cols.map(k => {
      if(k==='created_at'||k==='redeemed_at') return r[k] ? new Date(r[k]).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}) : '';
      if(k==='gift') return GIFT[r.gift]||''; if(k==='coupon_code'||k==='need_check') return r[k]||'';
      const q = LABEL[k]; return q.type==='scale'||q.type==='text' ? (r.answers[k] ?? '') : optText(q, r.answers[k]);
    }))].map(row => row.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const blob = new Blob(['﻿'+lines], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'dagam_survey_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  };
}

/* ---------- 시작 ---------- */
$('#next').onclick = () => go(1);
$('#back').onclick = () => go(-1);
const qs = location.search;
if(qs.includes('admin')) renderAdmin();
else if(qs.includes('staff')) renderStaff();
else { const s = store(); if(s.code) showCoupon(s.code); else renderIntro(); }
</script>
</body>
</html>
