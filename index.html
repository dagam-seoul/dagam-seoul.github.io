<style>
:root{--ink:#1d1d1b;--sub:#5e5a52;--bg:#f7f6f2;--card:#fff;--line:#ddd8ce;--accent:#f2c200;--ok:#1f7a3a;--warn:#b4561e;--dim:#9a958b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{font-size:18px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 120px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{font-weight:900;letter-spacing:.02em;font-size:20px}
.brand .logo{display:block;height:28px;width:auto;margin-bottom:6px}
.brand small{display:block;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.1em}
.prog{height:6px;background:#e9e5dd;border-radius:99px;overflow:hidden;margin:6px 0 18px}
.prog i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px}
h1{font-size:26px;line-height:1.35;margin:0 0 10px;font-weight:900;word-break:keep-all}
h2{font-size:22px;line-height:1.4;margin:0 0 6px;font-weight:800;word-break:keep-all}
.hint{color:var(--sub);font-size:15px;margin:0 0 16px;word-break:keep-all}
p{word-break:keep-all}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:block;width:100%;text-align:left;padding:16px 18px;font:inherit;font-size:18px;font-weight:600;background:#fff;border:2px solid var(--line);border-radius:14px;color:var(--ink);cursor:pointer;word-break:keep-all}
.opt.on{border-color:var(--ink);background:#fbf6dd}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px}
.scale .opt{text-align:center;padding:14px 2px;font-size:22px;font-weight:800}
.scale-lab{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-top:6px}
textarea{width:100%;min-height:120px;font:inherit;font-size:17px;padding:14px;border:2px solid var(--line);border-radius:14px;margin-top:12px}
.nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.nav .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;padding:17px;font:inherit;font-size:18px;font-weight:800;border-radius:14px;border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);flex:0 0 34%}
.btn:disabled{opacity:.35;cursor:default}
.coupon{text-align:center}
.coupon .code{font-size:46px;font-weight:900;letter-spacing:.18em;margin:6px 0 2px}
.coupon .gift{display:inline-block;margin:12px 0 4px;padding:10px 18px;border-radius:99px;background:var(--accent);font-weight:900;font-size:22px}
.badge{display:inline-block;padding:6px 14px;border-radius:99px;font-weight:800;font-size:15px}
.used{background:#e7e5df;color:#6b665d}
.ready{background:#e3f0e3;color:var(--ok)}
.check{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fdf1e7;color:var(--warn);font-size:15px;font-weight:600;word-break:keep-all}
.coupon.is-used .code,.coupon.is-used .gift{opacity:.35;text-decoration:line-through}
.small{font-size:14px;color:var(--sub)}
.staffbtn{margin-top:22px;width:100%;padding:15px;font:inherit;font-size:16px;font-weight:700;border-radius:12px;border:1.5px dashed var(--sub);background:transparent;color:var(--sub);cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.modal.on{display:flex}
.modal .card{width:100%;max-width:380px}
input.pin{width:100%;font:inherit;font-size:30px;letter-spacing:.4em;text-align:center;padding:12px;border:2px solid var(--line);border-radius:12px;margin:14px 0}
input.codein{width:100%;font:inherit;font-size:26px;letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:12px;border:2px solid var(--line);border-radius:12px}
.row{display:flex;gap:10px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:28px}
.stat span{font-size:14px;color:var(--sub)}
.over{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
th{background:#f1eee7}
.err{color:#b00020;font-weight:700;margin-top:10px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;display:none;z-index:10}
.giftpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.giftpick .opt{text-align:center;padding:14px 6px;font-size:16px}
.etc{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;margin-top:8px}
.sec{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--sub);margin-bottom:8px}
.lead b{display:block;font-weight:700;color:#3a362f}.lead .ld{display:block;font-weight:700;color:#3a362f}.lead .ld+b{margin-top:8px}
.lead{background:#fbf6dd;border-radius:12px;padding:12px 14px;font-size:15px;color:#4a463e;margin:0 0 14px;word-break:keep-all}
.guide{font-size:13px;color:var(--sub);background:#f4f2ec;border-radius:10px;padding:10px 12px;margin:4px 0 8px;word-break:keep-all;line-height:1.5}
</style>

/* ---------- 공통 ---------- */
async function rpc(fn, body){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {method:'POST', headers:{'apikey':SB_KEY,'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl = s => esc(s).replace(/\n/g,'<br>');
function store(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; } }
function save(o){ try{ localStorage.setItem(LS_KEY, JSON.stringify(Object.assign(store(), o))); }catch(e){} }
function deviceId(){ let s = store(); if(s.device) return s.device; const id = (crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random().toString(36).slice(2)); save({device:id}); return id; }
function toast(t){ const el=$('#toast'); el.textContent=t; el.style.display='block'; setTimeout(()=>el.style.display='none', 2400); }
function fmtTime(t){ if(!t) return ''; return new Date(t).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function ansText(q, a){
  const v = a[q.id]; if(v===undefined || v===null || v==='') return '';
  if(q.type==='text') return v;
  const o = q.opts.find(o => o[0]===v); let t = o ? o[1] : v;
  if(v==='etc') t = '기타: ' + (a[q.id+'_etc'] || '');
  return t;
}

/* ---------- 구글시트 ---------- */
function sheetPost(obj){ if(!SHEET_WEBHOOK) return; try{ fetch(SHEET_WEBHOOK, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(obj)}).catch(()=>{}); }catch(e){} }
function sheetResponse(code){
  const head = ['응답시각','교환권', ...Q.map(q => q.id.toUpperCase().replace('_','-')+' '+q.title)];
  const row = [new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}), code, ...Q.map(q => ansText(q, A))];
  sheetPost({type:'response', headers:head, row});
}
function sheetRedeem(code, gift, time){ sheetPost({type:'redeem', code, gift: GIFT[gift]||gift, time: new Date(time||Date.now()).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})}); }

/* ---------- 설문 ---------- */
let A = {}, idx = -1, sending = false;
const visible = () => Q.filter(q => !q.when || q.when(A));
function cleanup(){ const ids = new Set(visible().map(q=>q.id)); Object.keys(A).forEach(k => { const base = k.replace(/_etc$/,''); if(!ids.has(base)) delete A[k]; }); }

function renderIntro(){
  $('#nav').style.display=''; $('#progWrap').style.visibility='hidden'; $('#step').textContent='';
  $('#app').innerHTML = `<div class="card">
    <h1>다감 우체국 · 다감가든<br>만족도 조사</h1>
    <p>안녕하세요! 오늘 다감 우체국 또는 다감가든에서 어떤 시간을 보내셨나요?</p>
    <p>좋았던 경험도, 조금 아쉬웠던 부분도 편하게 들려주세요. 여러분의 의견은 두 공간을 더 좋게 만들고, 새로운 상시 체험을 준비하는 데 활용하겠습니다.</p>
    <p class="small">약 3분 · 이름과 연락처는 받지 않는 익명 조사예요.</p>
  </div>`;
  $('#back').style.visibility='hidden'; $('#next').textContent='시작하기'; $('#next').disabled=false;
}

function renderQ(){
  const vs = visible(); const q = vs[idx]; const prev = vs[idx-1];
  $('#progWrap').style.visibility='visible';
  $('#prog').style.width = Math.round(idx/vs.length*100)+'%';
  $('#step').textContent = `${idx+1} / ${vs.length}`;
  const showLead = q.sec !== (prev && prev.sec) && (q.lead || null);
  let body = '';
  if(q.type==='single'){
    body = `<div class="opts">${q.opts.map(([v,t]) => `<button class="opt ${A[q.id]===v?'on':''}" data-v="${v}">${esc(t)}</button>`).join('')}</div>`;
    if(A[q.id]==='etc') body += `<input class="etc" id="etcIn" maxlength="200" placeholder="직접 입력해 주세요" value="${esc(A[q.id+'_etc']||'')}">`;
  } else {
    body = `<textarea id="txt" maxlength="800" placeholder="자유롭게 적어 주세요">${esc(A[q.id]||'')}</textarea>`;
  }
  $('#app').innerHTML = `<div class="card"><span class="sec">${esc(q.sec)}</span>
    ${(showLead||q.stem)?`<div class="lead">${showLead?`<span class="ld">${esc(showLead)}</span>`:''}${q.stem?`<b>${esc(q.stem)}</b>`:''}</div>`:''}
    <h2>${q.no?esc(q.no)+'. ':''}${esc(q.title)}</h2>${q.hint?`<p class="hint">${nl(q.hint)}</p>`:''}${body}</div>`;
  $('#app').querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const v = q.num ? Number(b.dataset.v) : b.dataset.v;
    A[q.id] = v; cleanup(); renderQ();
    if(v==='etc'){ const e=$('#etcIn'); if(e) e.focus(); return; }
    setTimeout(() => { const vv = visible(); if(vv[idx]===q && idx < vv.length-1) go(1); }, 220);
  });
  const t = $('#txt'); if(t) t.oninput = () => { A[q.id] = t.value; };
  const e = $('#etcIn'); if(e) e.oninput = () => { A[q.id+'_etc'] = e.value; };
  $('#back').style.visibility='visible';
  $('#next').textContent = idx === vs.length-1 ? '제출하기' : '다음';
  $('#next').disabled = !(q.optional || (A[q.id] !== undefined && A[q.id] !== ''));
}

function go(d){
  const vs = visible();
  if(idx === -1 && d>0){ idx = 0; return renderQ(); }
  if(d<0){ if(idx<=0){ idx=-1; return renderIntro(); } idx--; return renderQ(); }
  if(idx >= vs.length-1) return submit();
  idx++; renderQ();
}

async function submit(){
  if(sending) return; sending = true; $('#next').disabled = true; $('#next').textContent='보내는 중…';
  cleanup();
  try{
    const res = await rpc('dagam_submit', {p_device: deviceId(), p_answers: A});
    save({code: res.code});
    if(!res.existing) sheetResponse(res.code);
    showCoupon(res.code);
  }catch(err){
    sending = false; $('#next').disabled=false; $('#next').textContent='다시 제출하기';
    toast('전송에 실패했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.');
  }
}

    <div class="code">${esc(code)}</div>

    ${used&&c.gift?`<div class="gift">${GIFT[c.gift]}</div>`:''}
    <p class="small" style="margin-top:12px">기념품은 소진 시 종료 · 1인 1회</p>
    ${used?'':`<button class="staffbtn" id="staffBtn">스태프 전용 · 기념품 증정 처리</button>`}
  </div>`;
  const sb = $('#staffBtn'); if(sb) sb.onclick = () => openPin(code);

let pinCode = null, pinGift = null, afterRedeem = null;
function openPin(code, after){
  pinCode = code; pinGift = null; afterRedeem = after || null;
  $('#pinIn').value=''; $('#pinErr').textContent='';
  $('#giftPick').querySelectorAll('.opt').forEach(b => b.classList.remove('on'));
  try{ const p = sessionStorage.getItem('dagam_pin'); if(p) $('#pinIn').value = p; }catch(e){}
  $('#pinModal').classList.add('on');
}
$('#giftPick').querySelectorAll('.opt').forEach(b => b.onclick = () => {
  pinGift = b.dataset.g; $('#giftPick').querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x===b));
});
$('#pinCancel').onclick = () => $('#pinModal').classList.remove('on');
$('#pinOk').onclick = async () => {
  const pin = $('#pinIn').value.trim();
  if(!pinGift){ $('#pinErr').textContent='드릴 기념품을 골라 주세요.'; return; }
  if(pin.length<4){ $('#pinErr').textContent='PIN 4자리를 입력해 주세요.'; return; }
  $('#pinOk').disabled = true;
  try{
    const r = await rpc('dagam_redeem', {p_code: pinCode, p_pin: pin, p_gift: pinGift});
    if(r.status==='bad_pin') $('#pinErr').textContent='PIN이 맞지 않아요.';
    else if(r.status==='already') $('#pinErr').textContent='이미 증정 완료된 응답이에요 ('+fmtTime(r.redeemed_at)+').';
    else if(r.status==='ok'){
      $('#pinModal').classList.remove('on');
      try{ sessionStorage.setItem('dagam_pin', pin); }catch(e){}
      sheetRedeem(pinCode, r.gift, r.redeemed_at);
      const ct = r.counts, k = r.gift;
      toast(`${GIFT[k]} 증정 완료 · 오늘 ${ct[k+'_today']}/${ct[k+'_daily_limit']}`);
      if(afterRedeem) afterRedeem(); else showCoupon(pinCode);
    } else $('#pinErr').textContent='처리할 수 없는 번호예요.';
  }catch(e){ $('#pinErr').textContent='전송 실패. 연결을 확인해 주세요.'; }
  $('#pinOk').disabled = false;
};

async function renderAdmin(){
  $('#nav').style.display='none'; $('#progWrap').style.visibility='hidden'; $('#step').textContent='관리자';
  let pin = null; try{ pin = sessionStorage.getItem('dagam_admin_pin'); }catch(e){}
  if(!pin) return pinGate('dagam_admin', 'dagam_admin_pin', renderAdmin);
  let d; try{ d = await rpc('dagam_admin', {p_pin: pin}); }catch(e){ $('#app').innerHTML='<p class="err">불러오기 실패</p>'; return; }
  if(d.status!=='ok'){ try{ sessionStorage.removeItem('dagam_admin_pin'); }catch(e){} return renderAdmin(); }
  const rows = d.rows, c = d.counts;
  const day = t => new Date(t).toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit'});
  const byDay = {};
  rows.forEach(r => { const k = day(r.created_at); byDay[k] = byDay[k] || {n:0,tea:0,seed:0}; byDay[k].n++;
    if(r.redeemed_at && r.gift){ const k2 = day(r.redeemed_at); byDay[k2] = byDay[k2] || {n:0,tea:0,seed:0}; byDay[k2][r.gift]++; } });
  const prog = {post:0, garden:0, both:0}; rows.forEach(r => { if(prog[r.answers.q4]!==undefined) prog[r.answers.q4]++; });
  const avg = (id, grp) => { const v = rows.filter(r => !grp || r.answers.q4===grp).map(r => r.answers[id]).filter(x => typeof x==='number');
    if(!v.length) return '–'; return (v.reduce((a,b)=>a+b,0)/v.length).toFixed(2)+' · '+Math.round(v.filter(x=>x>=4).length/v.length*100)+'% ('+v.length+')'; };
  const numIds = Q.filter(q => q.num).map(q => q.id);
  $('#app').innerHTML = `
    <h1>설문·기념품 현황</h1>
    <div class="stat">
      <div><span>전체 응답</span><b>${rows.length}</b><span>오늘 ${c.resp_today} · 우체국 ${prog.post} · 가든 ${prog.garden} · 모두 ${prog.both}</span></div>
      <div><span>기념품 증정 누적</span><b>${c.tea_all + c.seed_all}</b><span>블렌드티 ${c.tea_all}/${c.tea_total} · 씨앗 ${c.seed_all}/${c.seed_total}</span></div>
    </div>
    <button class="btn" style="width:100%;margin:6px 0 18px" id="csv">응답 전체 CSV 내려받기</button>
    <h2>날짜별</h2>
    <table><tr><th>날짜</th><th>응답</th><th>블렌드티</th><th>씨앗</th></tr>
    ${Object.keys(byDay).sort().map(k => `<tr><td>${k}</td><td>${byDay[k].n}</td><td>${byDay[k].tea||0}</td><td>${byDay[k].seed||0}</td></tr>`).join('')}</table>
    <h2 style="margin-top:22px">만족도 (5점 평균 · 긍정률)</h2>
    <table><tr><th>문항</th><th>전체</th><th>우체국만</th><th>가든만</th><th>모두</th></tr>
    ${numIds.map(id => `<tr><td>${id.toUpperCase().replace('_','-')} ${esc(QI[id].title)}</td><td>${avg(id)}</td><td>${avg(id,'post')}</td><td>${avg(id,'garden')}</td><td>${avg(id,'both')}</td></tr>`).join('')}
    </table>
    <p class="small">만족도 5점 = 매우 만족·매우 그렇다. 긍정률 = 4~5점 비율. 설정(PIN·하루 한도·총수량)은 Supabase dagam_settings 표에서 바꿉니다.</p>`;
  $('#csv').onclick = () => {
    const head = ['응답시각','응답번호','기념품','증정시각', ...Q.map(q => q.id.toUpperCase().replace('_','-')+' '+q.title)];
    const lines = [head, ...rows.map(r => [new Date(r.created_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}), r.coupon_code, GIFT[r.gift]||'',
      r.redeemed_at ? new Date(r.redeemed_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}) : '', ...Q.map(q => ansText(q, r.answers))])]
      .map(row => row.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿'+lines], {type:'text/csv;charset=utf-8'}));
    a.download = 'dagam_survey_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  };
}

/* ---------- 시작 ---------- */
$('#next').onclick = () => go(1);
$('#back').onclick = () => go(-1);
const qs = location.search;
if(qs.includes('reset')){ try{ localStorage.removeItem(LS_KEY); localStorage.removeItem('dagam_survey_v1'); }catch(e){} location.replace(location.pathname); }
else if(qs.includes('admin')) renderAdmin();
else if(qs.includes('staff')) renderStaff();
else { const s = store(); if(s.code) showCoupon(s.code); else renderIntro(); }
</script>
</body>
</html>
